<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Jarvis Test Home</title></head>
<body>
  <h1>Welcome to the test page</h1>
  <p>This is a paragraph of text on the index page.</p>
  <a href="/links.html" id="docs">Documentation link</a>
  <input id="name" aria-label="Your name" placeholder="Your name" />
  <button id="greet" type="button">Click me</button>
  <p id="result">original</p>
  <script>
    document.getElementById("greet").addEventListener("click", function () {
      var n = document.getElementById("name").value || "world";
      document.getElementById("result").textContent = "Hello " + n;
    });
  </script>
</body>
</html>
